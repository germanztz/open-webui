services:
  open-webui:
    container_name: open-webui
    image: openwebui/open-webui:latest
    network_mode: host
    volumes:
      - open-webui:/app/backend/data
    restart: unless-stopped
    environment: 
      # https://docs.openwebui.com/getting-started/env-configuration/
      - WEBUI_SECRET_KEY=cY1eWg2T2kF6MFtO
      - USER_AGENT="Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:144.0) Gecko/20100101 Firefox/144.0"
      - OLLAMA_BASE_URL=http://localhost:11434
      - DEFAULT_MODELS=qwen2.5:7b-instruct
      - ENABLE_OPENAI_API=False
      # - OPENAI_API_BASE_URL=''
      # - OPENAI_API_KEY=''
      - TASK_MODEL=qwen2.5:7b-instruct
      - TASK_MODEL_EXTERNAL==qwen2.5:7b-instruct
      - ENABLE_EVALUATION_ARENA_MODELS=False
      - ENABLE_MESSAGE_RATING=False
      - ENABLE_COMMUNITY_SHARING=False
      - ENABLE_VERSION_UPDATE_CHECK=False
      - SCARF_NO_ANALYTICS=True
      - DO_NOT_TRACK=True
      - ANONYMIZED_TELEMETRY=False

      - ENABLE_WEB_SEARCH=True
      - WEB_SEARCH_ENGINE=tavily
      - TAVILY_API_KEY=${TAVILY_API_KEY}

      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=qwen3-embedding

      - WHISPER_MODEL=base
      - WHISPER_LANGUAGE=es
      - WHISPER_VAD_FILTER=True
      - WHISPER_MODEL_AUTO_UPDATE=True

      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://localhost:11434/v1
      - AUDIO_TTS_OPENAI_API_KEY=ollama
      - AUDIO_TTS_MODEL=lfm3-omni
      - AUDIO_TTS_VOICE=female-spanish
      - AUDIO_TTS_SPLIT_ON=punctuation

  nginx:
    container_name: openwebui-nginx
    image: nginx:alpine
    network_mode: host
    depends_on:
      - open-webui
    restart: unless-stopped
    configs:
      - source: openwebui_nginx_conf
        target: /etc/nginx/conf.d/default.conf
      - source: openwebui_cert
        target: /tmp/openwebui-cert.pem
      - source: openwebui_key
        target: /tmp/openwebui-key.pem

volumes:
  open-webui:

configs:
  openwebui_nginx_conf:
    content: |
      map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      close;
      }

      server {
          listen 8443 ssl;
          server_name localhost omen.local openwebui.omen.local openwebui.avena.ddns.net;

          ssl_certificate     /tmp/openwebui-cert.pem;
          ssl_certificate_key /tmp/openwebui-key.pem;

          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_session_cache shared:SSL:10m;
          ssl_session_timeout 1d;

          client_max_body_size 100M;

          location / {
              proxy_pass http://127.0.0.1:8080;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection $$connection_upgrade;
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
              proxy_buffering off;
          }
      }
